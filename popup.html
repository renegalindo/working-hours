<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Working Hours</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="title">
      <h1>Working Hours</h1>
      <span class="help" tabindex="0" aria-describedby="help-tip">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
          <circle cx="8" cy="8" r="6.75" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M6.2 6.3a1.85 1.85 0 1 1 2.6 1.7c-.5.25-.8.6-.8 1.1v.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="8" cy="11.6" r=".9" fill="currentColor"/>
        </svg>
        <span class="tip" role="tooltip" id="help-tip">Shades the hours outside your working day in Google Calendar.</span>
      </span>
    </div>
    <label class="switch" title="Shade non-working hours (Alt+Shift+W)">
      <input type="checkbox" id="enabled">
      <span class="track"><span class="thumb"></span></span>
    </label>
  </header>

  <main id="panel">
    <section class="color-picker">
      <span class="label">Color</span>
      <div class="colors" id="colors" role="group" aria-label="Shade color"></div>
    </section>

    <section class="intensity">
      <label for="intensity">Shade</label>
      <input type="range" id="intensity" min="0" max="100" step="5">
    </section>

    <ol class="days" id="days"></ol>

    <button type="button" class="link" id="copy-monday">Copy Monday to all</button>
  </main>

  <template id="day-row">
    <li class="day">
      <label class="day-toggle">
        <input type="checkbox" class="on">
        <span class="name"></span>
      </label>
      <select class="start" aria-label="Start"></select>
      <span class="dash">–</span>
      <select class="end" aria-label="End"></select>
    </li>
  </template>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
